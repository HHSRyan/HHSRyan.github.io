<!DOCTYPE html>
<html>
<head>
  <title>Player Resources</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

  <style>
html, body {
  margin: 0;
  min-height: 100vh;
  font-family: 'Roboto', sans-serif;
  background: linear-gradient(to bottom, #ffffff 0%, #bdd6ac 100%);
  background-attachment: fixed;
  color: #48752c;
}
    .top {
      text-align: center;
      padding: 40px 20px 20px 20px;
    }

    .logo {
      max-width: 420px;
    }

.page-title {
  margin-top: 20px;
  font-size: 2.4em;
  font-weight: 700;
  color: #48752c;
}

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .panel-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
    }

    .panel {
      background: #bdd6ac;
      border: 3px solid #9dc384;
      border-radius: 14px;
      overflow: hidden;
    }

    .panel-header {
      background: linear-gradient(to right, #48752c, #bdd6ac);
      color: #bdd6ac;
      font-weight: 700;
      padding: 14px 18px;
      font-size: 1.3em;
    }

    .panel-body {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

/* CORE TOOLS BUTTONS */
.core-btn {
  width: 100%;
  padding: 16px;
  font-size: 1.05em;
  font-weight: 700;
  border-radius: 10px;
  border: 2px solid #48752c;      /* Dark Green outline */
  background: #9dc384;            /* Medium Green background */
  color: #48752c;                 /* Dark Green text */
  cursor: pointer;
  transition: all 0.2s ease;
}

.core-btn:hover {
  background: #48752c;
  color: #9dc384;
  border-color: #9dc384;
  transform: translateY(-3px);
}

/* LORE BUTTONS */
.lore-btn {
  width: 100%;
  padding: 16px;
  font-size: 1.05em;
  font-weight: 700;
  border-radius: 10px;
  border: 2px solid #bdd6ac;      /* Light Green outline */
  background: #48752c;            /* Dark Green background */
  color: #bdd6ac;                 /* Light Green text */
  cursor: pointer;
  transition: all 0.2s ease;
}

.lore-btn:hover {
  background: #bdd6ac;
  color: #48752c;
  border-color: #48752c;
  transform: translateY(-3px);
}

    /* Responsive */
    @media (max-width: 900px) {
      .panel-grid {
        grid-template-columns: 1fr;
      }
    }

  </style>
</head>

<body>

<div class="top">
  <img src="Atf Text Logo with Purple Stripe.png" alt="After the Fall Logo" class="logo">
  <h1 class="page-title">Player Resources</h1>
</div>

  <div class="container">
    <div class="panel-grid">

      <!-- LEFT PANEL -->
      <div class="panel">
        <div class="panel-header">
          Core Tools
        </div>
        <div class="panel-body">
<button class="core-btn" onclick="location.href='wizard.html'">
  Character Creator Wizard
</button>
<button class="core-btn" onclick="location.href='character-sheet.html'">
  Character Sheet
</button>

<!-- ===== CHARACTER MANAGER BUTTON START ===== -->
<button class="core-btn" onclick="toggleCharacterManager()">
  View / Delete Characters
</button>

<div id="characterManagerPanel" style="display:none; margin-top:12px;"></div>
<!-- ===== CHARACTER MANAGER BUTTON END ===== -->

        </div>
      </div>

      <!-- RIGHT PANEL -->
      <div class="panel">
        <div class="panel-header">
          Lore & Reference
        </div>
        <div class="panel-body">
<button class="lore-btn" onclick="window.open('AtFRules.html', '_blank')">
  Rulebook
</button>
<button class="lore-btn" onclick="window.open('AtFChronicle.html', '_blank')">
  The Chronicle of the Second Age
</button>
<button class="lore-btn" onclick="window.open('AtFPlayerReference.pdf', '_blank')">
  Player Reference Sheet
</button>
<button class="lore-btn" onclick="window.open('equipment-reference.html', '_blank')">
  Equipment Reference
</button>
        </div>
      </div>

    </div>
  </div>
<!-- ===== CHARACTER MANAGER SCRIPT START ===== -->
<script>
function toggleCharacterManager() {
  const panel = document.getElementById("characterManagerPanel");
  if (!panel) return;

  if (panel.style.display === "none") {
    renderCharacterManager();
    panel.style.display = "block";
  } else {
    panel.style.display = "none";
  }
}

function renderCharacterManager() {
  const panel = document.getElementById("characterManagerPanel");
  if (!panel) return;

  const characters = JSON.parse(localStorage.getItem("atfCharacters") || "[]");

  if (!characters.length) {
    panel.innerHTML = "<em>No saved characters found.</em>";
    return;
  }

/* ===== CHARACTER MANAGER RENDER FORMAT UPDATE START ===== */
panel.innerHTML = characters.map((c, index) => {

  const name =
    (c && c.appearance && c.appearance.name)
      ? c.appearance.name
      : "Unnamed Character";

  let classLine = "";

  if (Array.isArray(c.classes) && c.classes.length) {

    classLine = c.classes.map(cls => {
      const level = Number(cls.level) || 1;
      const className = cls.classId
        ? cls.classId.replace(/_/g, " ").replace(/\b\w/g, x => x.toUpperCase())
        : "Class";
      return `Level ${level} ${className}`;
    }).join(", ");

  } else if (c.classId) {

    const level = Number(c.level) || 1;
    const className =
      c.classId.replace(/_/g, " ").replace(/\b\w/g, x => x.toUpperCase());

    classLine = `Level ${level} ${className}`;
  }

  const savedAt = c.savedAt ? `Last Saved: ${c.savedAt}` : "";

  return `
    <div style="
        padding:12px;
        margin-bottom:8px;
        border-radius:10px;
        background: linear-gradient(to right, #bdd6ac, #9dc384);
    ">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <strong>${name}</strong>, ${classLine}
          <div style="font-size:0.85em; margin-top:4px;">${savedAt}</div>
        </div>
        <button
                style="
                  width:auto;
                  padding:8px 14px;
                  font-size:0.9em;
                  font-weight:700;
                  border-radius:8px;
                  border:2px solid #bdd6ac;
                  background:#48752c;
                  color:#bdd6ac;
                  cursor:pointer;
                "
                onclick="deleteCharacter(${index})">
          Delete
        </button>
      </div>
    </div>
  `;
}).join("");
/* ===== CHARACTER MANAGER RENDER FORMAT UPDATE END ===== */
}

function deleteCharacter(index) {
  const characters = JSON.parse(localStorage.getItem("atfCharacters") || "[]");
  if (!characters[index]) return;

  /* ===== DELETE NAME FIX START ===== */
const name =
  (characters[index] &&
   characters[index].appearance &&
   characters[index].appearance.name)
    ? characters[index].appearance.name
    : "Unnamed Character";
/* ===== DELETE NAME FIX END ===== */

  const confirmed = confirm(
    `Are you sure you want to delete ${name}? This is the really real world, there ain't no coming back.`
  );

  if (!confirmed) return;

  characters.splice(index, 1);
  localStorage.setItem("atfCharacters", JSON.stringify(characters));
  renderCharacterManager();
}
</script>
<!-- ===== CHARACTER MANAGER SCRIPT END ===== -->

</body>
</html>
</body>
</html>
